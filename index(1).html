<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sourdough Calculator — Capitani</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #a81911;
    --red-light: #f5e8e7;
    --red-mid: #c9302a;
    --green: #006e3d;
    --green-light: #e6f3ec;
    --ink: #1a1410;
    --ink-mid: #4a3f38;
    --ink-light: #8a7d76;
    --cream: #faf8f5;
    --cream-mid: #f0ebe3;
    --white: #ffffff;
    --border: #e0d8cf;
    --border-strong: #c8bdb4;
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* ── Header ── */
  header {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 1.25rem 2rem;
    display: flex;
    align-items: center;
    gap: 1.5rem;
  }

  .logo-wrap {
    height: 48px;
    flex-shrink: 0;
  }

  .logo-wrap svg {
    height: 48px;
    width: auto;
  }

  .header-divider {
    width: 1px;
    height: 36px;
    background: var(--border-strong);
    flex-shrink: 0;
  }

  .header-text h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 1.4rem;
    letter-spacing: 0.01em;
    color: var(--ink);
    line-height: 1.2;
  }

  .header-text p {
    font-size: 0.78rem;
    color: var(--ink-light);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 400;
    margin-top: 2px;
  }

  /* ── Main layout ── */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
  }

  .intro {
    margin-bottom: 2rem;
    text-align: center;
  }

  .intro p {
    font-size: 0.88rem;
    color: var(--ink-light);
    letter-spacing: 0.04em;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  /* ── Cards ── */
  .card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .card-header {
    padding: 1rem 1.25rem 0.9rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .card-header.red { background: var(--red-light); }
  .card-header.green { background: var(--green-light); }

  .card-badge {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.85rem;
    font-weight: 600;
    flex-shrink: 0;
  }

  .card-badge.red { background: var(--red); color: #fff; }
  .card-badge.green { background: var(--green); color: #fff; }

  .card-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.05rem;
    font-weight: 500;
    color: var(--ink);
    letter-spacing: 0.01em;
  }

  .card-subtitle {
    font-size: 0.72rem;
    color: var(--ink-light);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 400;
    margin-left: auto;
  }

  .card-body { padding: 1.25rem; }

  /* ── Fields ── */
  .field { margin-bottom: 1rem; }
  .field:last-of-type { margin-bottom: 0; }

  .field label {
    display: block;
    font-size: 0.75rem;
    font-weight: 400;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--ink-light);
    margin-bottom: 5px;
  }

  .field input[type="number"] {
    width: 100%;
    padding: 0.6rem 0.85rem;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    font-family: 'Jost', sans-serif;
    font-size: 0.95rem;
    font-weight: 300;
    color: var(--ink);
    background: var(--cream);
    transition: border-color 0.15s, background 0.15s;
    -moz-appearance: textfield;
  }

  .field input[type="number"]::-webkit-outer-spin-button,
  .field input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }

  .field input[type="number"]:focus {
    outline: none;
    border-color: var(--red);
    background: var(--white);
  }

  .ratio-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .ratio-row input[type="number"] {
    text-align: center;
    padding: 0.6rem 0.4rem;
  }

  .ratio-sep {
    font-size: 1.1rem;
    color: var(--border-strong);
    flex-shrink: 0;
    font-weight: 300;
  }

  /* ── Divider ── */
  .section-divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 1.25rem 0 1rem;
  }

  /* ── Results ── */
  .section-label {
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--ink-light);
    margin-bottom: 0.5rem;
    margin-top: 0.9rem;
  }

  .section-label:first-child { margin-top: 0; }

  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 6px 0;
    border-bottom: 1px solid var(--cream-mid);
    font-size: 0.9rem;
  }

  .result-row:last-child { border-bottom: none; }

  .result-label { color: var(--ink-mid); font-weight: 300; }

  .result-val {
    font-weight: 500;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    font-size: 0.92rem;
  }

  .result-val.accent-red { color: var(--red); }
  .result-val.accent-green { color: var(--green); }

  .result-total {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 8px 10px;
    margin-top: 8px;
    background: var(--cream-mid);
    border-radius: var(--radius-sm);
    font-size: 0.9rem;
  }

  .result-total .result-label { font-weight: 400; color: var(--ink); }
  .result-total .result-val { font-size: 1rem; }

  .empty-state {
    text-align: center;
    padding: 1.75rem 1rem;
    color: var(--ink-light);
    font-size: 0.85rem;
    font-style: italic;
    font-family: 'Cormorant Garamond', serif;
  }

  .pulled-tag {
    font-size: 0.68rem;
    color: var(--green);
    letter-spacing: 0.04em;
    font-weight: 400;
    font-style: normal;
    margin-left: 4px;
    text-transform: none;
  }

  /* ── Footer ── */
  footer {
    text-align: center;
    padding: 2rem;
    font-size: 0.75rem;
    color: var(--ink-light);
    letter-spacing: 0.04em;
    border-top: 1px solid var(--border);
    background: var(--white);
  }

  footer span { color: var(--red); }

  /* ── Mobile ── */
  @media (max-width: 600px) {
    header { padding: 1rem 1.25rem; gap: 1rem; }
    .logo-wrap { height: 38px; }
    .logo-wrap svg { height: 38px; }
    .header-text h1 { font-size: 1.15rem; }
    main { padding: 1.5rem 1rem 3rem; }
    .grid { grid-template-columns: 1fr; gap: 16px; }
  }
</style>
</head>

    </svg>
  </div>
  <div class="header-divider"></div>
  <div class="header-text">
    <h1>Sourdough Calculator</h1>
    <p>Dough formula &amp; starter feeding</p>
  </div>
</header>

<main>
  <div class="grid">

    <!-- WIDGET A -->
    <div class="card">
      <div class="card-header red">
        <div class="card-badge red">A</div>
        <span class="card-title">Total dough recipe</span>
      </div>
      <div class="card-body">
        <div class="field">
          <label for="totalFlour">Total flour (g)</label>
          <input type="number" id="totalFlour" placeholder="e.g. 1000" min="1" step="1" />
        </div>
        <div class="field">
          <label for="hydration">Hydration (%)</label>
          <input type="number" id="hydration" placeholder="e.g. 72" min="1" max="200" step="0.1" />
        </div>
        <div class="field">
          <label for="inoculation">Inoculation (%)</label>
          <input type="number" id="inoculation" placeholder="e.g. 20" min="0.1" max="100" step="0.1" />
        </div>

        <hr class="section-divider" />
        <div id="recipeOutput"><p class="empty-state">Fill in the fields above to see the recipe.</p></div>
      </div>
    </div>

    <!-- WIDGET B -->
    <div class="card">
      <div class="card-header green">
        <div class="card-badge green">B</div>
        <span class="card-title">Starter feeding</span>
      </div>
      <div class="card-body">
        <div class="field">
          <label for="starterTotal">Total starter needed (g) <span class="pulled-tag" id="pulledTag"></span></label>
          <input type="number" id="starterTotal" placeholder="Auto from A, or enter manually" min="0.1" step="0.1" />
        </div>
        <div class="field">
          <label>Feeding ratio — seed : flour : water</label>
          <div class="ratio-row">
            <input type="number" id="r1" value="1" min="0.1" step="0.1" />
            <span class="ratio-sep">:</span>
            <input type="number" id="r2" value="4" min="0.1" step="0.1" />
            <span class="ratio-sep">:</span>
            <input type="number" id="r3" value="4" min="0.1" step="0.1" />
          </div>
        </div>

        <hr class="section-divider" />
        <div id="feedingOutput"><p class="empty-state">Enter starter amount and ratio above.</p></div>
      </div>
    </div>

  </div>
</main>

<footer>
  <p>Capitani Pizzeria &nbsp;·&nbsp; <span>sourdough calculator</span> &nbsp;·&nbsp; Vila Nova de Gaia</p>
</footer>

<script>
  ['totalFlour','hydration','inoculation','starterTotal','r1','r2','r3'].forEach(id =>
    document.getElementById(id).addEventListener('input', compute)
  );

  function fmt(n) { return n.toFixed(1) + ' g'; }

  function row(label, val, cls) {
    return `<div class="result-row"><span class="result-label">${label}</span><span class="result-val${cls ? ' ' + cls : ''}">${val}</span></div>`;
  }

  function compute() {
    const flour   = parseFloat(document.getElementById('totalFlour').value);
    const hydPct  = parseFloat(document.getElementById('hydration').value);
    const inocPct = parseFloat(document.getElementById('inoculation').value);
    const r1      = parseFloat(document.getElementById('r1').value) || 1;
    const r2      = parseFloat(document.getElementById('r2').value) || 4;
    const r3      = parseFloat(document.getElementById('r3').value) || 4;

    const recipeDiv   = document.getElementById('recipeOutput');
    const feedDiv     = document.getElementById('feedingOutput');
    const pulledTag   = document.getElementById('pulledTag');
    const starterInput = document.getElementById('starterTotal');

    const validDough = flour > 0 && hydPct > 0 && inocPct > 0;
    const ratioTotal = r1 + r2 + r3;

    let starterTotal, starterFlour, starterWater;
    let seed, feedFlour, feedWater;

    if (validDough) {
      starterTotal = flour * inocPct / 100;
      if (document.activeElement !== starterInput) {
        starterInput.value = starterTotal.toFixed(1);
      }
      pulledTag.textContent = '← from A';
    } else {
      starterTotal = parseFloat(starterInput.value);
      pulledTag.textContent = '';
    }

    if (starterTotal > 0 && r1 > 0 && r2 > 0 && r3 > 0) {
      seed       = starterTotal * r1 / ratioTotal;
      feedFlour  = starterTotal * r2 / ratioTotal;
      feedWater  = starterTotal * r3 / ratioTotal;
      starterFlour = feedFlour;
      starterWater = feedWater;
    }

    // Widget A output
    if (validDough && starterTotal > 0 && feedFlour !== undefined) {
      const totalWater = flour * hydPct / 100;
      const finalFlour = flour - starterFlour;
      const finalWater = totalWater - starterWater;

      recipeDiv.innerHTML =
        `<p class="section-label">Totals</p>` +
        row('Total flour', fmt(flour)) +
        row('Total water', fmt(totalWater)) +
        row('Total starter', fmt(starterTotal), 'accent-red') +
        `<p class="section-label">From starter</p>` +
        row('Flour from starter', fmt(starterFlour)) +
        row('Water from starter', fmt(starterWater)) +
        `<p class="section-label">Add to final dough</p>` +
        row('Flour to add', fmt(finalFlour)) +
        row('Water to add', fmt(finalWater));
    } else {
      recipeDiv.innerHTML = '<p class="empty-state">Fill in the fields above to see the recipe.</p>';
    }

    // Widget B output
    if (starterTotal > 0 && seed !== undefined) {
      feedDiv.innerHTML =
        `<p class="section-label">Feeding breakdown</p>` +
        row('Seed (mature starter)', fmt(seed)) +
        row('Fresh flour', fmt(feedFlour)) +
        row('Water', fmt(feedWater)) +
        `<div class="result-total">
          <span class="result-label">Total after feeding</span>
          <span class="result-val accent-green">${fmt(starterTotal)}</span>
        </div>`;
    } else {
      feedDiv.innerHTML = '<p class="empty-state">Enter starter amount and ratio above.</p>';
    }
  }
</script>

</body>
</html>
